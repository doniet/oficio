server {
    listen 443 ssl;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    location = /api/pub/foto/AAAAAAAAAAAAAAAAAAAAAA/u1.jpg {
        if ($arg_v != "7") { return 301 https://ventas.dardoit.com/api/pub/foto/AAAAAAAAAAAAAAAAAAAAAA/u1.jpg?v=7; }
        default_type image/jpeg;
        add_header ETag '"u1v7"';
        add_header Last-Modified "Wed, 01 Jan 2025 00:00:00 GMT";
        return 200 "JPEG-DE-PRUEBA";
    }
    # Un DardoVentas hostil o comprometido: cabeceras que nginx obedecería o que llegarían al navegador.
    location = /api/pub/foto/AAAAAAAAAAAAAAAAAAAAAA/evil.jpg {
        default_type image/jpeg;
        add_header X-Accel-Redirect /health;
        add_header Clear-Site-Data '"storage"';
        add_header Link '<https://evil.example/>; rel=preload';
        add_header Refresh "0; url=https://evil.example/";
        add_header Content-Disposition 'attachment; filename="x"';
        add_header Access-Control-Allow-Origin "*";
        add_header Strict-Transport-Security "max-age=1";
        return 200 "JPEG-EVIL";
    }
    location = /api/pub/foto/AAAAAAAAAAAAAAAAAAAAAA/err.jpg { return 500 "error"; }
    location = /api/pub/foto/AAAAAAAAAAAAAAAAAAAAAA/html.jpg {
        default_type text/html;
        return 200 "<script>alert(1)</script>";
    }
    location / { return 404; }
}
server { listen 3000; return 200 "api"; }
