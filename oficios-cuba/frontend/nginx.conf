# TLS termina en Cloudflare; aquí todo es HTTP interno detrás de Traefik.
# Tasa CUP/USD de dardoventas.com (medianas de elTOQUE). Se cachea aquí: si dardoventas no
# responde se sirve la última copia, y si nunca hubo copia, la de respaldo de la API.
proxy_cache_path /var/cache/nginx/tasas levels=1 keys_zone=tasas:1m max_size=2m inactive=7d use_temp_path=off;

# Fotos del catálogo importado de DardoVentas (miniaturas de 256 px, ~12 MB todas hoy). max_size es
# obligatorio: el disco de vps2 va al 79 % y sin tope la caché crece hasta llenarlo.
proxy_cache_path /var/cache/nginx/dvfotos levels=1:2 keys_zone=dvfotos:2m max_size=64m inactive=30d use_temp_path=off;

# Un año solo para la foto buena: la URL lleva su versión. Un 301 (versión vieja) o un 404 cambian.
map $status $dv_foto_cache {
    200     "public, max-age=31536000, immutable";
    default "public, max-age=300";
}

map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://images.unsplash.com; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nombres con hash de Vite: se pueden cachear para siempre.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /demo/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # El `try_files ... /index.html` de `location /` hace una redirección interna a /index.html, que caía
    # en la regex de extensiones y salía SIN no-cache: el navegador guardaba el HTML y, tras un despliegue,
    # seguía pidiendo el bundle viejo. add_header en una location anula los del server: se repiten todos.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://images.unsplash.com; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # APK de Android: carpeta descargas/ de vps2 montada en solo lectura (no va en la imagen). El nombre
    # lleva la versión → caché para siempre; android.json (lo lee la web) siempre fresco.
    location ^~ /descargas/ {
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        location ~ \.apk$ {
            add_header Content-Disposition "attachment" always;
            # Sin `always`: un 404 de un APK que no existe no debe quedarse un año en la caché de Cloudflare.
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location = /descargas/android.json {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        return 404;
    }

    # Fotos del catálogo de DardoVentas. `^~` porque si no la regex de extensiones de abajo se queda
    # con el .jpg. Lo que manda el visitante solo pasa si encaja en la regex (capturas con nombre:
    # el `if` de la versión borraría $1/$2), y el destino es fijo.
    location ^~ /ext/dv/foto/ {
        location ~ "^/ext/dv/foto/(?<dv_slug>[A-Za-z0-9_-]{16,64})/(?<dv_uid>[A-Za-z0-9_-]{1,64})\.jpg$" {
            if ($arg_v !~ "^[A-Za-z0-9_-]{1,32}$") { return 404; }
            resolver 127.0.0.11 valid=300s ipv6=off;
            resolver_timeout 5s;
            set $dv_foto_upstream https://ventas.dardoit.com/api/pub/foto/$dv_slug/$dv_uid.jpg?v=$arg_v;
            proxy_pass $dv_foto_upstream;
            proxy_ssl_server_name on;
            proxy_set_header Host ventas.dardoit.com;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
            proxy_hide_header Content-Security-Policy;
            proxy_ignore_headers Set-Cookie Cache-Control Expires;
            # La versión vieja redirige a la buena: que el navegador vuelva aquí, no a DardoVentas
            # (la CSP de la web no le deja cargar imágenes de otro origen).
            proxy_redirect https://ventas.dardoit.com/api/pub/foto/ /ext/dv/foto/;
            # Sin esto nginx completa el Location con http://<host>/ (esquema interno, sin https): se queda relativo.
            absolute_redirect off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_cache dvfotos;
            proxy_cache_key "$dv_slug/$dv_uid/$arg_v";
            proxy_cache_valid 200 30d;
            proxy_cache_valid 301 404 5m;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header Cache-Control $dv_foto_cache always;
            add_header X-Content-Type-Options "nosniff" always;
            # Se sirve desde nuestro origen: si del otro lado llega HTML en vez de una foto, no puede
            # ejecutar nada. En un <img> la CSP no afecta.
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }
        return 404;
    }

    # Coincidencia exacta: gana a `^~ /api/`. Destino fijo, sin nada del visitante en la URL.
    location = /api/tasas {
        resolver 127.0.0.11 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $tasas_upstream https://dardoventas.com/tasas.json;
        proxy_pass $tasas_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host dardoventas.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        proxy_cache tasas;
        proxy_cache_key tasas;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_intercept_errors on;
        error_page 400 403 404 500 502 503 504 = @tasas_respaldo;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @tasas_respaldo {
        proxy_pass http://oficio_api:3000;
        proxy_set_header Host $host;
    }

    location ^~ /api/ {
        proxy_pass http://oficio_api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header CF-Connecting-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # 🚨 Esta regex le gana a cualquier prefijo SIN `^~`: por eso /api/, /assets/ y /demo/ lo llevan.
    # Sin él, /api/uploads/<id>.webp nunca llegaba a la API (404 de nginx) y la caché de assets no se aplicaba.
    # Solo las rutas sin extensión caen al index de la SPA; un asset que falta es 404 real
    # (evita que Cloudflare cachee index.html como si fuera una imagen o un script).
    location ~* "\.[a-z0-9]{2,5}$" {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://images.unsplash.com; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
